# ============================================================================
#  小猫头鹰课堂 (ChinaStudyFree) — nginx 站点配置模板
#
#  占位符（安装脚本会用 sed 替换）：
#    @@LISTEN_PORT@@   监听端口，默认 8899
#    @@SITE_ROOT@@     站点根目录（Next.js 静态导出产物所在目录）
#    @@PROGRESS_DIR@@  跨设备共享学习进度的读写目录（nginx 以 WebDAV 方式暴露）
#
#  放法：
#    Docker 方案  -> /etc/nginx/conf.d/default.conf
#    原生 方案    -> /etc/nginx/sites-available/studyfree（并 enable 软链）
# ============================================================================

server {
    listen       @@LISTEN_PORT@@;
    server_name  _;

    root   @@SITE_ROOT@@;
    index  index.html;

    # 重定向用相对路径，避免丢端口（例如 8899 被弹回 80）
    absolute_redirect off;

    # 兜底：浏览器直接打开 Next 的 RSC 数据文件时弹回正常页面
    # （客户端 fetch 的 Sec-Fetch-Dest 是 empty，不受影响）
    location ~ ^/(?<rscdir>.+)/index\.txt$ {
        if ($http_sec_fetch_dest = document) {
            return 301 /$rscdir/;
        }
    }
    location = /index.txt {
        if ($http_sec_fetch_dest = document) {
            return 301 /;
        }
    }

    # Next 构建产物文件名带内容哈希，可长期强缓存
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ------------------------------------------------------------------
    # 跨设备共享学习进度
    #
    # 前端把原本只写 localStorage 的进度换成这里的远端存储：
    # 同一台服务器的所有设备（iPad / 手机 / 电脑）共用同一份 state.json，
    # 在一台设备上学到 20%，换另一台继续接着学，而不是从 0 开始。
    #
    # 依赖 nginx 的 WebDAV 模块：--with-http_dav_module
    # 目录需对 nginx worker 用户（Debian=www-data，官方镜像=nginx uid 101）
    # 可写，脚本会自动 chmod。
    # ------------------------------------------------------------------
    location /api/progress/ {
        alias @@PROGRESS_DIR@@/;
        dav_methods PUT DELETE;
        dav_access user:rw group:rw all:r;
        create_full_put_path on;
        client_max_body_size 8m;
        autoindex off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        limit_except GET PUT DELETE HEAD OPTIONS {
            deny all;
        }
    }

    # HTML 每次回源校验，避免浏览器拿旧页面里的旧 chunk 名继续跑旧代码
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
